name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run electron:make
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/make/dmg/arm64/Gallery-*-arm64.dmg Gallery-darwin-arm64.dmg
          gh release create "$GITHUB_REF_NAME" Gallery-darwin-arm64.dmg --title "$GITHUB_REF_NAME" --generate-notes
